<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Executive Form | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:700px;">

          <div class="page-header">
            <div class="page-header-left">
              <h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Assign Executive Position</h1>
              <p id="formSubtitle">Assign a member to an executive or committee position</p>
            </div>
          </div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="execForm">
            <div class="card" style="margin-bottom:1.25rem;">
              <div class="card-header"><div class="card-header-title">Position Details</div></div>
              <div class="card-body">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Select Member <span class="required">*</span></label>
                    <select name="member" id="member" class="form-control" required>
                      <option value="">Search and select a member</option>
                    </select>
                    <div class="form-help">Choose from registered members who are not currently assigned</div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Position/Title <span class="required">*</span></label>
                    <select name="post" id="post" class="form-control" required>
                      <option value="">Select position</option>
                    </select>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Tenure Start Date <span class="required">*</span></label>
                    <input type="date" name="start_date" id="start_date" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Tenure End Date</label>
                    <input type="date" name="end_date" id="end_date" class="form-control">
                    <div class="form-help">Leave blank if position is currently active</div>
                  </div>
                </div>

                <div class="form-group">
                  <div class="form-check" style="display:flex;align-items:center;gap:0.625rem;">
                    <input type="checkbox" name="is_current" id="is_current" class="form-check-input" checked>
                    <label class="form-check-label" for="is_current" style="font-size:0.875rem;color:var(--oya-text-primary);cursor:pointer;">
                      Position is currently active
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <div style="display:flex;gap:1rem;justify-content:flex-end;padding:1rem 0;">
              <a href="executives.html" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Cancel
              </a>
              <button type="submit" class="btn btn-primary" id="submitBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span id="submitLabel">Assign Position</span>
              </button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/executive-form.js"></script>
</body>
</html>
