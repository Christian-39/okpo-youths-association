<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d62">
  <script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script>
  <title>Clans | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Clans</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Umu Nna clans used to group members</p>
            </div>
            <div class="page-header-actions">
              <a href="clan-form.html" class="btn btn-primary" id="addBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Clan
              </a>
            </div>
          </div>

          <div class="card">
            <div class="table-container" style="overflow-x:auto;">
              <table class="data-table" style="white-space:nowrap;">
                <thead><tr><th>Clan Name</th><th>Members</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="2" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

    async function load() {
      const tbody = document.getElementById("tbody");
      try {
        const data = await window.OYA_API.apiFetch("/members/api/clans/list/");
        tbody.innerHTML = data.results.length
          ? data.results.map((c) => `<tr><td><span class="cell-name">${esc(c.name)}</span></td><td><span class="badge badge-secondary">${c.member_count} member${c.member_count === 1 ? "" : "s"}</span></td></tr>`).join("")
          : `<tr><td colspan="2" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">No clans recorded yet.</td></tr>`;
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center;padding:2rem;color:var(--oya-danger);">Couldn't load: ${esc(err.message)}</td></tr>`;
      }
    }

    (async function () {
      const user = await window.OYA_SHELL.init({ page: "clans", title: "Clans" });
      if (!user) return;
      if (user.has_executive_access) document.getElementById("addBtn").style.display = "";
      load();
    })();
  </script>
</body>
</html>
