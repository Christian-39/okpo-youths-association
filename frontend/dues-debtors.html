<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Dues Debtors | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Yearly Dues Debtors</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Members with outstanding dues, sorted by highest debt</p>
            </div>
            <div class="page-header-actions"><a href="dues.html" class="btn btn-secondary">Back to Tracker</a></div>
          </div>

          <div class="dashboard-grid dashboard-grid-2" style="margin-bottom:1.5rem;">
            <div class="kpi-card accent-danger"><div class="kpi-value" style="color:var(--oya-danger);" id="kpiOutstanding">—</div><div class="kpi-label">Total Outstanding</div></div>
            <div class="kpi-card"><div class="kpi-value" id="kpiMembers">—</div><div class="kpi-label">Debtor Members</div></div>
          </div>

          <div class="filters-bar" style="flex-wrap:wrap;gap:0.5rem;">
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">Year:</span>
              <select id="yearFilter" class="form-control" style="width:120px;"><option value="">All</option></select>
            </div>
          </div>

          <div class="card">
            <div class="table-toolbar">
              <div class="toolbar-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search by name, serial, phone...">
              </div>
            </div>
            <div class="table-container" style="overflow-x:auto;">
              <table class="data-table" style="white-space:nowrap;">
                <thead><tr><th>Member</th><th>Total Due</th><th>Total Paid</th><th>Debt</th><th>Years Missed</th><th>Last Payment</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
            <div class="card-footer" id="paginationFooter" style="display:none;">
              <span style="font-size:0.8125rem;color:var(--oya-text-muted);" id="paginationSummary"></span>
              <div class="pagination" id="paginationControls"></div>
            </div>
          </div>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/dues-debtors.js"></script>
</body>
</html>
