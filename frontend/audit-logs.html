<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Audit Log | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
  <style>
    #auditTable { white-space: nowrap; }
    #auditTable th, #auditTable td { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Audit Log</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Complete record of all system activities and user actions</p>
            </div>
            <div class="page-header-actions">
              <a href="#" id="exportLink" class="btn btn-secondary" target="_blank" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export
              </a>
            </div>
          </div>

          <div class="filters-bar" style="flex-wrap:wrap;gap:0.5rem;">
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">Action:</span>
              <select id="actionFilter" class="form-control" style="width:160px;"><option value="">All Actions</option></select>
            </div>
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">Entity:</span>
              <select id="entityFilter" class="form-control" style="width:160px;"><option value="">All Entities</option></select>
            </div>
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">From:</span>
              <input type="date" id="dateFrom" class="form-control" style="width:140px;">
            </div>
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">To:</span>
              <input type="date" id="dateTo" class="form-control" style="width:140px;">
            </div>
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">User:</span>
              <input type="text" id="userSearch" class="form-control" placeholder="Search user..." style="width:150px;">
            </div>
            <div style="margin-left:auto;font-size:0.875rem;color:var(--oya-text-secondary);white-space:nowrap;" id="statsSummary"></div>
          </div>

          <div class="card">
            <div class="table-toolbar">
              <div class="toolbar-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search logs...">
              </div>
            </div>
            <div class="table-container">
              <table class="data-table" id="auditTable">
                <thead>
                  <tr><th>Timestamp</th><th>User</th><th>Action</th><th>Entity</th><th>Description</th><th>IP Address</th><th style="width:60px;">View</th></tr>
                </thead>
                <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
            <div class="card-footer" id="paginationFooter" style="display:none;">
              <span style="font-size:0.8125rem;color:var(--oya-text-muted);" id="paginationSummary"></span>
              <div class="pagination" id="paginationControls"></div>
            </div>
          </div>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="detailModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
    <div class="modal" style="background:var(--oya-card-bg, #fff);border-radius:var(--oya-radius, 12px);max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem;border-bottom:1px solid var(--oya-border);">
        <h3 style="margin:0;">Audit Log Detail</h3>
        <button type="button" id="closeModalBtn" class="btn btn-sm btn-ghost">&times;</button>
      </div>
      <div class="modal-body" id="modalBody" style="padding:1.25rem;"></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/audit-logs.js"></script>
</body>
</html>
