<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d62">
  <script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script>
  <title>Pledge Detail | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">
          <div id="loadingState" style="text-align:center;padding:3rem;color:var(--oya-text-muted);">Loading&hellip;</div>
          <div id="detailContent" style="display:none;"></div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function naira(n) { return "\u20A6" + Math.round(Number(n) || 0).toLocaleString("en-NG"); }
    const pledgeId = new URLSearchParams(window.location.search).get("id");

    function statusBadge(s) {
      if (s === "COMPLETED") return `<span class="badge badge-success">Completed</span>`;
      if (s === "PARTIALLY_PAID") return `<span class="badge badge-info">Partially Paid</span>`;
      if (s === "CANCELLED") return `<span class="badge badge-secondary">Cancelled</span>`;
      return `<span class="badge badge-warning">Pending</span>`;
    }

    function renderPaymentRow(p, canManage) {
      return `<tr>
        <td><span class="cell-muted">${p.payment_date}</span></td>
        <td class="text-end" style="font-weight:600;color:var(--oya-success);white-space:nowrap;">${naira(p.amount)}</td>
        <td><span class="cell-muted">${esc(p.payment_method_display)}</span></td>
        <td><span class="cell-muted">${esc(p.reference_number || "\u2014")}</span></td>
        <td><span class="cell-muted">${esc(p.recorded_by || "\u2014")}</span></td>
        ${canManage ? `<td><button type="button" class="table-action-btn js-delete-payment" data-id="${p.id}" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></td>` : ""}
      </tr>`;
    }

    function renderActionsCard(pledge, canManage) {
      if (!canManage || pledge.status === "CANCELLED" || pledge.status === "COMPLETED") return "";
      if (pledge.donation_type === "MONEY") {
        return `
        <div class="card">
          <div class="card-header" style="padding:1rem 1.25rem;border-bottom:1px solid var(--oya-border);"><div class="card-header-title" style="font-size:1rem;">Record a Payment</div></div>
          <div class="card-body">
            <div id="paymentFormErrors" style="display:none;margin-bottom:1rem;"></div>
            <form id="paymentForm">
              <div class="form-group" style="margin-bottom:1rem;">
                <label class="form-label">Amount (&#x20A6;) <span style="color:var(--oya-danger);">*</span></label>
                <input type="number" name="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
              </div>
              <div class="form-group" style="margin-bottom:1rem;">
                <label class="form-label">Payment Date</label>
                <input type="date" name="payment_date" class="form-control" value="${new Date().toISOString().slice(0, 10)}">
              </div>
              <div class="form-group" style="margin-bottom:1rem;">
                <label class="form-label">Payment Method</label>
                <select name="payment_method" id="paymentMethodSelect" class="form-select"></select>
              </div>
              <div class="form-group" style="margin-bottom:1rem;">
                <label class="form-label">Reference Number</label>
                <input type="text" name="reference_number" class="form-control" placeholder="Reference Number">
              </div>
              <div class="form-group" style="margin-bottom:1.25rem;">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Notes..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;" id="paymentFormSubmit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Record Payment
              </button>
            </form>
          </div>
        </div>`;
      }
      return `
      <div class="card">
        <div class="card-header" style="padding:1rem 1.25rem;border-bottom:1px solid var(--oya-border);"><div class="card-header-title" style="font-size:1rem;">Fulfil This Pledge</div></div>
        <div class="card-body">
          <p style="color:var(--oya-text-secondary);font-size:0.875rem;margin-bottom:1rem;">
            ${esc(pledge.donation_type_display)} pledges are fulfilled in one step once the ${pledge.donation_type === "LABOUR" ? "work is completed" : "materials are delivered"}.
          </p>
          <button type="button" class="btn btn-primary" style="width:100%;margin-bottom:0.75rem;" id="fulfillBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            Mark Fulfilled
          </button>
          <button type="button" class="btn btn-secondary" style="width:100%;" id="cancelBtn">Cancel Pledge</button>
        </div>
      </div>`;
    }

    function render(data) {
      const p = data.pledge;
      const canManage = data.can_manage;
      const donorName = p.donor ? p.donor.full_name : "Anonymous";
      const isOutside = p.donor_type === "OUTSIDE";

      const summaryCards = p.donation_type === "MONEY" ? `
        <div class="kpi-card"><div class="kpi-header"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div></div><div class="kpi-value">${esc(p.display_value)}</div><div class="kpi-label">Pledged</div></div>
        <div class="kpi-card accent-success"><div class="kpi-header"><div class="kpi-icon" style="background:var(--oya-success-bg);color:var(--oya-success);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div><div class="kpi-value" style="color:var(--oya-success);">${naira(p.total_paid)}</div><div class="kpi-label">Total Paid</div></div>
        <div class="kpi-card accent-warning"><div class="kpi-header"><div class="kpi-icon" style="background:var(--oya-warning-bg);color:var(--oya-warning);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div><div class="kpi-value" style="color:var(--oya-warning);">${naira(p.outstanding_balance)}</div><div class="kpi-label">Outstanding Balance</div></div>`
        : `
        <div class="kpi-card"><div class="kpi-header"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div></div><div class="kpi-value">${esc(p.display_value)}</div><div class="kpi-label">Pledged</div></div>
        <div class="kpi-card accent-info"><div class="kpi-header"><div class="kpi-icon" style="background:var(--oya-info-bg);color:var(--oya-info);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.42 4.58a5.4 5.4 0 0 1 0 7.65L12 20.65l-8.42-8.42a5.4 5.4 0 1 1 7.65-7.65L12 5.24l.77-.66a5.4 5.4 0 0 1 7.65 0z"/></svg></div></div><div class="kpi-value">${p.estimated_value ? naira(p.estimated_value) : '<span class="cell-muted" style="font-size:1rem;">Not valued</span>'}</div><div class="kpi-label">Estimated Value</div></div>
        <div class="kpi-card"><div class="kpi-header"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div></div><div class="kpi-value">${p.status === "COMPLETED" ? "Fulfilled" : p.status === "CANCELLED" ? "Cancelled" : "Outstanding"}</div><div class="kpi-label">Fulfilment</div></div>`;

      return `
      <div class="page-header" style="flex-wrap:wrap;gap:0.75rem;">
        <div class="page-header-left">
          <h1 style="font-size:clamp(1.125rem,3vw,1.5rem);">${esc(donorName)}${isOutside ? ' <span class="badge badge-info" style="font-size:0.625rem;">Outside Donor</span>' : ""}</h1>
          <p style="font-size:0.875rem;"><span class="badge ${esc(p.donation_type_badge_class)}">${esc(p.donation_type_display)}</span> pledge for <strong>${p.project ? esc(p.project.title) : "\u2014"}</strong></p>
        </div>
        <div class="page-header-actions" style="flex-wrap:wrap;gap:0.5rem;">
          <a href="pledges.html" class="btn btn-secondary" style="white-space:nowrap;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Pledges
          </a>
          ${canManage && p.status !== "CANCELLED" ? `<a href="pledge-form.html?id=${p.id}" class="btn btn-primary" style="white-space:nowrap;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Pledge</a>` : ""}
          ${window.__currentUser && window.__currentUser.has_admin_access ? `<button type="button" class="btn btn-danger" id="deletePledgeBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete</button>` : ""}
        </div>
      </div>

      ${p.notes ? `<div class="card" style="margin-bottom:1.5rem;"><div class="card-body" style="padding:1rem 1.25rem;"><p style="color:var(--oya-text-secondary);margin:0;font-size:0.875rem;"><strong>Notes:</strong> ${esc(p.notes)}</p></div></div>` : ""}

      <div class="dashboard-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-bottom:1.5rem;">
        ${summaryCards}
        <div class="kpi-card accent-info">
          <div class="kpi-header"><div class="kpi-icon" style="background:var(--oya-info-bg);color:var(--oya-info);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div></div>
          <div class="kpi-value">${statusBadge(p.status)}${p.is_overdue ? ' <span class="badge badge-danger">Overdue</span>' : ""}</div>
          <div class="kpi-label">Status${p.due_date ? " \u00b7 Due " + p.due_date : ""}</div>
        </div>
      </div>

      <div class="dashboard-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:1.5rem;align-items:start;">
        ${renderActionsCard(p, canManage)}
        ${p.donation_type === "MONEY" ? `
        <div class="card">
          <div class="card-header" style="padding:1rem 1.25rem;border-bottom:1px solid var(--oya-border);"><div class="card-header-title" style="font-size:1rem;">Payment History</div></div>
          <div class="card-body" style="padding:0;">
            <div class="table-container" style="overflow-x:auto;max-height:560px;overflow-y:auto;">
              <table class="data-table" style="white-space:nowrap;">
                <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Recorded By</th>${canManage ? '<th style="width:60px;"></th>' : ""}</tr></thead>
                <tbody id="paymentsBody">
                  ${data.payments.length ? data.payments.map((pay) => renderPaymentRow(pay, canManage)).join("") : `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">No payments recorded yet.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>` : ""}
      </div>`;
    }

    let paymentMethodChoices = [];

    async function loadAndRender() {
      const data = await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/`);
      document.getElementById("detailContent").innerHTML = render(data);
      wireEvents(data);
      return data;
    }

    function showPaymentErrors(errors) {
      const box = document.getElementById("paymentFormErrors");
      if (!box) return;
      const lines = Array.isArray(errors) ? errors : Object.entries(errors || {}).flatMap(([f, m]) => (Array.isArray(m) ? m : [m]).map((x) => `${f}: ${x.message || x}`));
      box.innerHTML = lines.map((m) => `<div class="alert alert-danger" style="margin-bottom:0.5rem;">${esc(m)}</div>`).join("");
      box.style.display = lines.length ? "" : "none";
    }

    function wireEvents(data) {
      const paySelect = document.getElementById("paymentMethodSelect");
      if (paySelect) {
        paymentMethodChoices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; paySelect.appendChild(o); });
      }

      const paymentForm = document.getElementById("paymentForm");
      if (paymentForm) {
        paymentForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("paymentFormSubmit");
          btn.disabled = true;
          showPaymentErrors([]);
          try {
            const formData = new FormData(paymentForm);
            await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/payments/create/`, { method: "POST", body: formData });
            window.OYA.showToast("Payment recorded successfully.", "success");
            await loadAndRender();
          } catch (err) {
            showPaymentErrors((err.data && (err.data.errors || err.data)) || [err.message || "Something went wrong."]);
            btn.disabled = false;
          }
        });
      }

      document.querySelectorAll(".js-delete-payment").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this payment? This also removes its linked finance record.")) return;
          try {
            await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/payments/${btn.dataset.id}/delete/`, { method: "POST" });
            window.OYA.showToast("Payment deleted.", "success");
            await loadAndRender();
          } catch (err) {
            window.OYA.showToast(err.message || "Couldn't delete payment.", "error");
          }
        });
      });

      const fulfillBtn = document.getElementById("fulfillBtn");
      if (fulfillBtn) {
        fulfillBtn.addEventListener("click", async () => {
          if (!confirm("Mark this pledge as fulfilled?")) return;
          try {
            await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/fulfill/`, { method: "POST" });
            window.OYA.showToast("Pledge marked as fulfilled.", "success");
            await loadAndRender();
          } catch (err) {
            window.OYA.showToast(err.message || "Something went wrong.", "error");
          }
        });
      }

      const cancelBtn = document.getElementById("cancelBtn");
      if (cancelBtn) {
        cancelBtn.addEventListener("click", async () => {
          if (!confirm("Cancel this pledge?")) return;
          try {
            await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/cancel/`, { method: "POST" });
            window.OYA.showToast("Pledge cancelled.", "success");
            await loadAndRender();
          } catch (err) {
            window.OYA.showToast(err.message || "Something went wrong.", "error");
          }
        });
      }

      const deleteBtn = document.getElementById("deletePledgeBtn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Delete this pledge? This also removes any linked payment/finance records. This cannot be undone.")) return;
          try {
            await window.OYA_API.apiFetch(`/project-donations/api/pledges/${pledgeId}/delete/`, { method: "POST" });
            window.OYA.showToast("Pledge deleted.", "success");
            window.location.href = "pledges.html";
          } catch (err) {
            window.OYA.showToast(err.message || "Couldn't delete pledge.", "error");
          }
        });
      }
    }

    (async function () {
      const user = await window.OYA_SHELL.init({ page: "pledges", title: "Pledge Detail" });
      if (!user) return;
      window.__currentUser = user;
      try {
        const meta = await window.OYA_API.apiFetch("/project-donations/api/pledges/form-meta/");
        paymentMethodChoices = meta.payment_method_choices;
        await loadAndRender();
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("detailContent").style.display = "";
      } catch (err) {
        document.getElementById("loadingState").innerHTML = `<div class="alert alert-danger">Couldn't load pledge: ${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
