<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Notifications | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">
          <div id="loadingState" style="text-align:center;padding:3rem;color:var(--oya-text-muted);">Loading&hellip;</div>
          <div id="detailContent" style="display:none;"></div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <!-- Notification detail modal -->
  <div class="modal-overlay" id="detailModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
    <div class="modal" style="background:var(--oya-bg-card, #fff);border-radius:var(--oya-radius, 12px);max-width:560px;width:90%;max-height:80vh;overflow-y:auto;">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem;border-bottom:1px solid var(--oya-border);">
        <h3 style="margin:0;font-size:1rem;" id="detailModalTitle">Notification</h3>
        <button type="button" id="closeDetailModalBtn" class="btn btn-sm btn-ghost">&times;</button>
      </div>
      <div class="modal-body" id="detailModalBody" style="padding:1.25rem;"></div>
    </div>
  </div>

  <!-- Send notification modal -->
  <div class="modal-overlay" id="createModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
    <div class="modal" style="background:var(--oya-bg-card, #fff);border-radius:var(--oya-radius, 12px);max-width:520px;width:90%;max-height:85vh;overflow-y:auto;">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem;border-bottom:1px solid var(--oya-border);">
        <h3 style="margin:0;font-size:1rem;">Send Notification</h3>
        <button type="button" id="closeCreateModalBtn" class="btn btn-sm btn-ghost">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem;">
        <div id="createFormErrors" style="display:none;margin-bottom:1rem;"></div>
        <form id="createForm" novalidate>
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" name="title" id="notifTitle" class="form-input" placeholder="Notification title" required>
          </div>
          <div class="form-group">
            <label class="form-label">Message</label>
            <textarea name="message" id="notifMessage" class="form-textarea" rows="4" placeholder="Notification message..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Type</label>
            <select name="notification_type" id="notifType" class="form-select">
              <option value="INFO">Info</option>
              <option value="SUCCESS">Success</option>
              <option value="WARNING">Warning</option>
              <option value="ERROR">Error</option>
              <option value="ELECTION">Election</option>
              <option value="FINANCE">Finance</option>
              <option value="PROJECT">Project</option>
              <option value="CASE">Case</option>
              <option value="SYSTEM">System</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;font-weight:500;">
              <input type="checkbox" id="notifIsGlobal">
              Send to all members (global)
            </label>
          </div>
          <div class="form-group" id="recipientGroup">
            <label class="form-label">Recipient</label>
            <div style="position:relative;">
              <input type="text" id="recipientSearch" class="form-input" placeholder="Search member by name, no. or phone…" autocomplete="off">
              <input type="hidden" id="recipientId">
              <div id="recipientResults" class="dropdown-menu" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:220px;overflow-y:auto;z-index:10;"></div>
            </div>
          </div>
          <div class="form-actions" style="margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" id="createFormSubmit">Send Notification</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
</body>
</html>
