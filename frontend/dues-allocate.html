<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Record Dues Payment | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:640px;">

          <div class="page-header"><div class="page-header-left"><h1 style="font-size:clamp(1.125rem,3vw,1.5rem);">Record Dues Payment</h1><p style="font-size:0.875rem;color:var(--oya-text-muted);">Enter a total amount — it will be smart-allocated across outstanding years automatically.</p></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>
          <div id="resultBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="allocateForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group" style="position:relative;">
                <label class="form-label" for="memberSearch">Member</label>
                <input type="text" id="memberSearch" class="form-control" placeholder="Search member by name, no. or phone…" autocomplete="off" required>
                <input type="hidden" id="member" name="member">
                <div id="memberResults" class="dropdown-menu" style="position:absolute;top:100%;left:0;right:0;z-index:20;display:none;max-height:220px;overflow-y:auto;"></div>
              </div>

              <div id="outstandingPreview" style="display:none;padding:0.875rem;background:var(--oya-bg);border-radius:var(--oya-radius);font-size:0.8125rem;"></div>

              <div class="form-group">
                <label class="form-label" for="total_amount">Total Amount (&#x20A6;)</label>
                <input type="number" id="total_amount" name="total_amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="receipt_reference">Receipt Reference</label>
                <input type="text" id="receipt_reference" name="receipt_reference" class="form-control" placeholder="e.g., TRX-123456, Receipt #001">
              </div>
              <div class="form-group">
                <label class="form-label" for="payment_date">Payment Date</label>
                <input type="date" id="payment_date" name="payment_date" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="2"></textarea>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="dues.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Allocate Payment</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/dues-allocate.js"></script>
</body>
</html>
