<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Task Force | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Task Force</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Members assigned to enforcement and dispute resolution</p>
            </div>
            <div class="page-header-actions">
              <a href="taskforce-form.html" class="btn btn-primary" id="addBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Assign Member
              </a>
            </div>
          </div>

          <div class="dashboard-grid dashboard-grid-3" style="margin-bottom:1.5rem;">
            <div class="kpi-card"><div class="kpi-value" id="kpiTotal">—</div><div class="kpi-label">Total</div></div>
            <div class="kpi-card accent-success"><div class="kpi-value" style="color:var(--oya-success);" id="kpiActive">—</div><div class="kpi-label">Active</div></div>
            <div class="kpi-card accent-secondary"><div class="kpi-value" id="kpiInactive">—</div><div class="kpi-label">Inactive</div></div>
          </div>

          <div class="filters-bar" style="flex-wrap:wrap;gap:0.5rem;">
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">Status:</span>
              <select id="statusFilter" class="form-control" style="width:150px;">
                <option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option>
              </select>
            </div>
          </div>

          <div class="card">
            <div class="table-container">
              <table class="data-table" style="white-space:nowrap;">
                <thead><tr><th>Member</th><th>Clan</th><th>Assigned Date</th><th>Notes</th><th>Status</th><th style="width:110px;">Actions</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
            <div class="card-footer" id="paginationFooter" style="display:none;">
              <span style="font-size:0.8125rem;color:var(--oya-text-muted);" id="paginationSummary"></span>
              <div class="pagination" id="paginationControls"></div>
            </div>
          </div>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/taskforces.js"></script>
</body>
</html>
