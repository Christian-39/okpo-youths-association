<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Record Pledge | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:680px;">

          <div class="page-header"><div class="page-header-left"><h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Record Pledge</h1></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="pledgeForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="project">Fundraising Project</label>
                <select id="project" name="project" class="form-select" required><option value="">-- Select Fundraising Project --</option></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="donor_type">Donor Type</label>
                <select id="donor_type" name="donor_type" class="form-select" required></select>
              </div>

              <div class="form-group" id="memberGroup">
                <label class="form-label">Member</label>
                <div style="position:relative;">
                  <input type="text" id="memberSearch" class="form-input" placeholder="Search member by name, no. or phone…" autocomplete="off">
                  <input type="hidden" id="member" name="member">
                  <div id="memberResults" class="dropdown-menu" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:220px;overflow-y:auto;z-index:10;"></div>
                </div>
              </div>

              <div class="form-group" id="outsideDonorGroup" style="display:none;">
                <label class="form-label" for="outside_donor">Outside Donor</label>
                <select id="outside_donor" name="outside_donor" class="form-select"><option value="">-- Select Outside Donor --</option></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="donation_type">Contribution Type</label>
                <select id="donation_type" name="donation_type" class="form-select" required></select>
              </div>

              <!-- Money fields -->
              <div id="moneyFields" style="display:flex;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="pledged_amount">Pledged Amount (&#x20A6;)</label>
                  <input type="number" id="pledged_amount" name="pledged_amount" class="form-control" step="0.01" min="0.01" placeholder="0.00">
                </div>
              </div>

              <!-- Material fields -->
              <div id="materialFields" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="material_name">Material Name</label>
                  <input type="text" id="material_name" name="material_name" class="form-control" placeholder="e.g. Bags of Rice, Cement, Chairs">
                </div>
                <div class="form-group">
                  <label class="form-label" for="quantity">Quantity</label>
                  <input type="text" id="quantity" name="quantity" class="form-control" placeholder="e.g. 50 bags, 200kg, 20 units">
                </div>
              </div>

              <!-- Labour fields -->
              <div id="labourFields" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="labour_type">Labour Type</label>
                  <input type="text" id="labour_type" name="labour_type" class="form-control" placeholder="e.g. Carpentry, Painting, Site Supervision">
                </div>
                <div class="form-group">
                  <label class="form-label" for="number_of_days">Number of Days</label>
                  <input type="number" id="number_of_days" name="number_of_days" class="form-control" min="1" placeholder="Number of days">
                </div>
              </div>

              <!-- Material/Labour shared -->
              <div id="estimatedValueGroup" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="estimated_value">Estimated Value (&#x20A6;)</label>
                  <input type="number" id="estimated_value" name="estimated_value" class="form-control" step="0.01" min="0" placeholder="Optional">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="2" placeholder="Notes..."></textarea>
              </div>
              <div class="form-group" id="statusGroup" style="display:none;">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select"></select>
                <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Editing an existing pledge's status directly overrides its computed status.</span>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="pledges.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save Pledge</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/pledge-form.js"></script>
</body>
</html>
