<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Members | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>

      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <!-- Page Header -->
          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Member Directory</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Manage and view all registered members of OKPO Youths Association</p>
            </div>
            <div class="page-header-actions" style="flex-wrap:wrap;gap:0.5rem;">
              <button class="btn btn-secondary" id="exportBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export
              </button>
              <a href="member-form.html" class="btn btn-primary" id="addMemberBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Member
              </a>
            </div>
          </div>

          <!-- Stats Bar -->
          <div class="filters-bar" style="flex-wrap:wrap;gap:0.5rem;">
            <div class="filter-group">
              <span class="filter-label" style="font-size:clamp(0.75rem, 1.5vw, 0.8125rem);">Status:</span>
              <select id="statusFilter" class="form-control" style="width:160px;">
                <option value="">All Status</option>
              </select>
            </div>
            <div class="filter-group">
              <span class="filter-label" style="font-size:clamp(0.75rem, 1.5vw, 0.8125rem);">Clan:</span>
              <select id="clanFilter" class="form-control" style="width:160px;">
                <option value="">All Clans</option>
              </select>
            </div>
            <div style="margin-left:auto;font-size:clamp(0.75rem, 2vw, 0.875rem);color:var(--oya-text-secondary);white-space:nowrap;" id="statsSummary">
              <strong style="color:var(--oya-text-primary);">0</strong> total members
            </div>
          </div>

          <!-- Members Table -->
          <div class="card">
            <div class="table-toolbar" style="flex-wrap:wrap;">
              <div class="toolbar-search" style="max-width:100%;">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="memberSearch" placeholder="Search by name, serial number, clan...">
              </div>
            </div>

            <div class="table-container" style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
              <table class="data-table" id="membersTable">
                <thead>
                  <tr>
                    <th style="width:40px;"><input type="checkbox" class="form-check-input" id="selectAll" style="margin:0;"></th>
                    <th>Member</th>
                    <th>Serial Number</th>
                    <th>Clan</th>
                    <th>Status</th>
                    <th>Position</th>
                    <th>Age</th>
                    <th>State/Abroad</th>
                    <th>Joined</th>
                    <th style="width:100px;">Actions</th>
                  </tr>
                </thead>
                <tbody id="membersTbody">
                  <tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading members&hellip;</td></tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div class="card-footer" id="paginationFooter" style="display:none;">
              <span style="font-size:clamp(0.6875rem, 1.5vw, 0.8125rem);color:var(--oya-text-muted);white-space:nowrap;" id="paginationSummary"></span>
              <div class="pagination" id="paginationControls"></div>
            </div>
          </div>

        </div>
      </div>

      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/members.js"></script>
</body>
</html>
