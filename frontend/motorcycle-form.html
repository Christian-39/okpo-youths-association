<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Motorcycle Form | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:600px;">

          <div class="page-header"><div class="page-header-left"><h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Register Motorcycle</h1></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="mcForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="asset_tag">Asset Tag</label>
                <input type="text" id="asset_tag" name="asset_tag" class="form-control" placeholder="e.g. OYA-MC-001" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="brand">Brand</label>
                <input type="text" id="brand" name="brand" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="model">Model</label>
                <input type="text" id="model" name="model" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="year">Year</label>
                <input type="number" id="year" name="year" class="form-control" min="1990" max="2100">
              </div>
              <div class="form-group">
                <label class="form-label" for="condition">Condition</label>
                <select id="condition" name="condition" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="assigned_to">Assigned To</label>
                <select id="assigned_to" name="assigned_to" class="form-select"><option value="">Unassigned</option></select>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="motorcycles.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/motorcycle-form.js"></script>
</body>
</html>
