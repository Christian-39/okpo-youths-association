<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Users | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Users</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Every account with system access &mdash; members, executives, and admins</p>
            </div>
            <div class="page-header-actions">
              <button type="button" class="btn btn-secondary" id="pinResetBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Reset PIN
              </button>
              <a href="user-form.html" class="btn btn-primary" id="addBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Admin
              </a>
            </div>
          </div>

          <div class="filters-bar" style="flex-wrap:wrap;gap:0.5rem;">
            <div class="filter-group">
              <span class="filter-label" style="font-size:0.75rem;">Role:</span>
              <select id="roleFilter" class="form-control" style="width:160px;"><option value="">All Roles</option></select>
            </div>
          </div>

          <div class="card">
            <div class="table-toolbar">
              <div class="toolbar-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search by name, serial no., phone, state...">
              </div>
            </div>
            <div class="table-container" style="overflow-x:auto;">
              <table class="data-table" style="white-space:nowrap;">
                <thead><tr><th>Serial No.</th><th>Name</th><th>Phone</th><th>State</th><th>Role</th><th>Status</th><th style="width:90px;">Actions</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--oya-text-muted);">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
            <div class="card-footer" id="paginationFooter" style="display:none;">
              <span style="font-size:0.8125rem;color:var(--oya-text-muted);" id="paginationSummary"></span>
              <div class="pagination" id="paginationControls"></div>
            </div>
          </div>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <!-- PIN reset modal -->
  <div class="modal-overlay" id="pinModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
    <div class="modal" style="background:var(--oya-bg-card, #fff);border-radius:var(--oya-radius, 12px);max-width:420px;width:90%;">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem;border-bottom:1px solid var(--oya-border);">
        <h3 style="margin:0;font-size:1rem;">Reset User PIN</h3>
        <button type="button" id="closePinModalBtn" class="btn btn-sm btn-ghost">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem;">
        <div id="pinFormErrors" style="display:none;margin-bottom:1rem;"></div>
        <form id="pinResetForm">
          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label">Serial Number</label>
            <input type="text" name="serial_number" class="form-control" placeholder="OYA-2026-0001" required>
          </div>
          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label">New PIN</label>
            <input type="password" name="new_pin" class="form-control" maxlength="6" minlength="6" inputmode="numeric" placeholder="New 6-digit PIN" required>
          </div>
          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label">Confirm New PIN</label>
            <input type="password" name="confirm_pin" class="form-control" maxlength="6" minlength="6" inputmode="numeric" placeholder="Confirm new PIN" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="pinResetSubmit">Reset PIN</button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/users.js"></script>
</body>
</html>
