<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a3d62"><link rel="manifest" href="manifest.webmanifest"><script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script><title>Donation | OYA</title><link rel="icon" type="image/png" href="assets/images/oya_logo.png"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><style>.detail-list{display:grid;gap:0}.detail-row{display:grid;grid-template-columns:minmax(9rem, .35fr) 1fr;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--oya-border)}.detail-row:last-child{border-bottom:0}.detail-row dt{color:var(--oya-text-muted);font-size:.8125rem}.detail-row dd{margin:0;color:var(--oya-text-primary);overflow-wrap:anywhere}@media(max-width:600px){.detail-row{grid-template-columns:1fr;gap:.25rem}}</style><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/darkmode.css"><link rel="stylesheet" href="assets/css/mobile.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/pwa.css"></head>
<body><div class="app-shell"><div id="sidebar-slot"></div><div class="sidebar-overlay" id="sidebarOverlay"></div><main class="main-content" id="mainContent"><div id="topbar-slot"></div><div class="content-area"><div class="page-container"><div id="loading" style="text-align:center;padding:3rem;color:var(--oya-text-muted)">Loading donation…</div><div id="content" hidden></div></div></div><div id="footer-slot"></div></main></div><div id="mobile-top-header-slot"></div><div id="mobile-nav-slot"></div><div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2 id="confirmTitle">Confirm action</h2><button type="button" class="modal-close" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><p id="confirmText"></p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-close-modal>Cancel</button><button type="button" class="btn btn-danger" id="confirmAction">Confirm</button></div></div></div></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/pwa.js"></script><script>
const id=new URLSearchParams(location.search).get("id");const esc=v=>{const n=document.createElement("span");n.textContent=v==null?"":String(v);return n.innerHTML;};const money=v=>`₦${Math.round(Number(v)||0).toLocaleString("en-NG")}`;const label=v=>v==null||v===""?"—":String(v);let user,donation;
function row(name,value){return `<div class="detail-row"><dt>${esc(name)}</dt><dd>${esc(label(value))}</dd></div>`;}
function close(){window.OYA?.closeModal("confirmModal");}async function refresh(){const data=await window.OYA_API.apiFetch(`/project-donations/api/donations/${encodeURIComponent(id)}/`);donation=data.donation;render();}function confirmAction(title,text,action,refreshAfter=true){document.getElementById("confirmTitle").textContent=title;document.getElementById("confirmText").textContent=text;document.getElementById("confirmAction").onclick=async()=>{const b=document.getElementById("confirmAction");b.disabled=true;try{await action();close();if(refreshAfter)await refresh();window.OYA?.showToast("Action completed.","success");}catch(e){window.OYA?.showToast(e.message,"error");b.disabled=false;}};window.OYA?.openModal("confirmModal");}
function render(){const d=donation;const canManage=!!user.has_executive_access;document.getElementById("content").innerHTML=`<div class="page-header" style="flex-wrap:wrap;gap:1rem"><div class="page-header-left"><h1>Donation record</h1><p>${esc(d.project?.title||"Project donation")} · ${esc(d.status_display||d.status)}</p></div><div class="page-header-actions" style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn btn-secondary" href="donations.html">Back to donations</a>${canManage?`<a class="btn btn-primary" href="donation-form.html?id=${d.id}">Edit donation</a>`:""}</div></div><div class="dashboard-grid dashboard-grid-4" style="margin-bottom:1.5rem">${row("Value",d.display_value)}${row("Status",d.status_display)}${row("Donation date",d.donation_date)}${row("Recorded by",d.recorded_by)}</div><div class="card"><div class="card-header"><div><div class="card-header-title">Record details</div><div class="card-header-subtitle">The authoritative donation data returned by the backend.</div></div></div><div class="card-body"><dl class="detail-list">${row("Project",d.project?.title)}${row("Donor",d.donor_name)}${row("Donor type",d.donor_type)}${row("Donation type",d.donation_type_display)}${row("Amount",d.amount?money(d.amount):"—")}${row("Material",d.material_name)}${row("Quantity",d.quantity)}${row("Labour",d.labour_type)}${row("Number of days",d.number_of_days)}${row("Estimated value",d.estimated_value?money(d.estimated_value):"—")}${row("Payment method",d.payment_method)}${row("Reference number",d.reference_number)}${row("Invited by",d.invited_by?.full_name)}${row("Narration",d.narration)}${row("Remarks",d.remarks)}</dl></div><div class="card-footer" style="display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap">${canManage&&d.status==="PLEDGE"?`<button class="btn btn-secondary" id="fulfillBtn">Mark fulfilled</button><button class="btn btn-secondary" id="cancelBtn">Cancel pledge</button>`:""}${user.has_admin_access?`<button class="btn btn-danger" id="deleteBtn">Delete donation</button>`:""}</div></div>`;document.getElementById("loading").style.display="none";document.getElementById("content").hidden=false;document.getElementById("fulfillBtn")?.addEventListener("click",()=>confirmAction("Mark pledge fulfilled?","This changes the pledge status to confirmed.",()=>window.OYA_API.apiFetch(`/project-donations/api/donations/${id}/fulfill/`,{method:"POST"})));document.getElementById("cancelBtn")?.addEventListener("click",()=>confirmAction("Cancel this pledge?","The pledge will be marked as cancelled.",()=>window.OYA_API.apiFetch(`/project-donations/api/donations/${id}/cancel-pledge/`,{method:"POST"})));document.getElementById("deleteBtn")?.addEventListener("click",()=>confirmAction("Delete this donation?","This action cannot be undone.",()=>window.OYA_API.apiFetch(`/project-donations/api/donations/${id}/delete/`,{method:"DELETE"}).then(()=>location.assign("donations.html")),false));document.querySelectorAll("[data-close-modal]").forEach(b=>b.addEventListener("click",close));}
(async()=>{user=await window.OYA_SHELL.init({page:"donations",title:"Donation detail"});if(!user||!id){document.getElementById("loading").innerHTML='<div class="alert alert-danger">A donation id is required.</div>';return;}try{const data=await window.OYA_API.apiFetch(`/project-donations/api/donations/${encodeURIComponent(id)}/`);donation=data.donation;render();}catch(e){document.getElementById("loading").innerHTML=`<div class="alert alert-danger">Couldn't load this donation: ${esc(e.message)}</div>`;}})();
</script></body></html>
