<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <title>Offline | OYA</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14213d;background:#f5f7fb}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.25rem}
    main{width:min(28rem,100%);background:#fff;border:1px solid #d7dee8;border-radius:1rem;padding:2rem;text-align:center;box-shadow:0 12px 36px #0b3d9118}
    img{width:72px;height:72px;object-fit:contain;margin-bottom:1rem}h1{font-size:1.35rem;margin:.25rem 0 .75rem}p{line-height:1.55;color:#64748b;margin:0 0 1.25rem}
    .retry-button{display:inline-block;border:0;border-radius:.6rem;background:#0b3d91;color:#fff;padding:.7rem 1rem;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
</head>
<body><main><img src="assets/icons/icon-192.png" alt="OYA"><h1>You're offline</h1><p>Some information may be unavailable until your connection returns. Reconnect and try again.</p><a href="" class="retry-button">Try again</a></main></body>
</html>
