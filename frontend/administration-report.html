<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a3d62"><link rel="manifest" href="manifest.webmanifest"><script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script><title>Administration Report | OYA</title><link rel="icon" type="image/png" href="assets/images/oya_logo.png"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/darkmode.css"><link rel="stylesheet" href="assets/css/mobile.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/pwa.css"></head>
<body><div class="app-shell"><div id="sidebar-slot"></div><div class="sidebar-overlay" id="sidebarOverlay"></div><main class="main-content" id="mainContent"><div id="topbar-slot"></div><div class="content-area"><div class="page-container"><div id="loading" style="text-align:center;padding:3rem;color:var(--oya-text-muted)">Loading report…</div><div id="content" hidden></div></div></div><div id="footer-slot"></div></main></div><div id="mobile-top-header-slot"></div><div id="mobile-nav-slot"></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/pwa.js"></script><script>
const key=new URLSearchParams(location.search).get("key");const esc=v=>{const n=document.createElement("span");n.textContent=v==null?"":String(v);return n.innerHTML;};const label=v=>v&&typeof v==="object"?(v.label||v.name||v.title||v.full_name||"—"):(v==null?"—":String(v));const money=v=>`₦${Math.round(Number(v)||0).toLocaleString("en-NG")}`;
function card(title,value){return `<div class="kpi-card"><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(title)}</div></div>`;}
function block(title,item){if(!item)return"";const entries=item.counts&&typeof item.counts==="object"?Object.entries(item.counts).slice(0,8):[];const arr=Array.isArray(item.handled)?item.handled:Array.isArray(item.all_current)?item.all_current:Array.isArray(item.all_motorcycles)?item.all_motorcycles:Array.isArray(item.items)?item.items:[];return `<div class="card" style="margin-bottom:1rem"><div class="card-header"><div><div class="card-header-title">${esc(title)}</div><div class="card-header-subtitle">${esc(item.description||"")}</div></div></div><div class="card-body">${entries.length?`<div class="dashboard-grid dashboard-grid-4" style="margin-bottom:1rem">${entries.map(([k,v])=>card(k.replaceAll("_"," "),label(v))).join("")}</div>`:""}${arr.length?`<div class="table-container"><table class="data-table"><tbody>${arr.slice(0,12).map(row=>`<tr><td>${esc(label(row))}</td><td class="cell-muted">${esc(row.status||row.condition||row.case_number||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="cell-muted">No records in this section.</p>`}</div></div>`;}
(async function(){const user=await window.OYA_SHELL.init({page:"handover",title:"Administration Report",requireExecutive:true});if(!user||!key)return;try{const data=await window.OYA_API.apiFetch(`/elections/api/administrations/${encodeURIComponent(key)}/`);const r=data.report||{},a=r.administration||{},f=r.finance||{};document.getElementById("content").innerHTML=`<div class="page-header" style="flex-wrap:wrap;gap:1rem"><div class="page-header-left"><h1>${esc(a.name||"Administration report")}</h1><p>${esc(a.status||"")} · ${esc(a.tenure_start||"—")} → ${esc(a.tenure_end||"Present")}</p></div><div class="page-header-actions"><a class="btn btn-secondary" href="administrations.html">Back to administrations</a></div></div><div class="dashboard-grid dashboard-grid-4" style="margin-bottom:1.5rem">${card("Total income",money(f.total_income))}${card("Dues collected",money(f.total_dues))}${card("Project donations",money(f.total_donations))}${card("Total expenses",money(f.total_expenses))}</div>${block("Finance",r.finance)}${block("Projects",r.projects)}${block("Cases",r.cases)}${block("Task force",r.taskforce)}${block("Motorcycles",r.motorcycles)}${block("Donation groups",r.donation_groups)}${block("Donations",r.donations)}${block("Pledges",r.pledges)}${block("Membership",r.membership)}${block("Elections conducted",r.elections_conducted)}${block("Achievements",r.achievements)}${block("Records handed over",r.handed_over)}${block("Other records",r.extra_sections)}`;document.getElementById("loading").style.display="none";document.getElementById("content").hidden=false;}catch(error){document.getElementById("loading").innerHTML=`<div class="alert alert-danger">Couldn't load report: ${esc(error.message)}</div>`;}})();
</script></body></html>
