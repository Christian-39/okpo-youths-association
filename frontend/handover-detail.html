<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a3d62"><link rel="manifest" href="manifest.webmanifest"><script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script>
  <title>Handover Details | OYA</title><link rel="icon" type="image/png" href="assets/images/oya_logo.png"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/darkmode.css"><link rel="stylesheet" href="assets/css/mobile.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell"><div id="sidebar-slot"></div><div class="sidebar-overlay" id="sidebarOverlay"></div><main class="main-content" id="mainContent"><div id="topbar-slot"></div><div class="content-area"><div class="page-container" id="pageContainer"><div id="loadingState" style="text-align:center;padding:3rem;color:var(--oya-text-muted);">Loading handover…</div><div id="content" hidden></div></div></div><div id="footer-slot"></div></main></div><div id="mobile-top-header-slot"></div><div id="mobile-nav-slot"></div>
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal"><div class="modal-header"><h2 class="modal-title" id="confirmTitle">Delete handover?</h2><button class="modal-close" id="cancelDelete" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>This permanently removes the handover ledger record. Calculated financial records remain unchanged.</p></div><div class="modal-footer"><button class="btn btn-secondary" id="cancelDelete2" type="button">Cancel</button><button class="btn btn-danger" id="confirmDelete" type="button">Delete handover</button></div></div></div>
  <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/pwa.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const esc = (v) => { const n = document.createElement("span"); n.textContent = v == null ? "" : String(v); return n.innerHTML; };
    const money = (v) => `₦${Math.round(Number(v) || 0).toLocaleString("en-NG")}`;
    const metric = (label, value, accent) => `<div class="kpi-card ${accent || ""}"><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div>`;
    function label(v) { return v && typeof v === "object" ? (v.label || v.name || v.title || v.full_name || "—") : (v == null ? "—" : String(v)); }
    function section(title, item) {
      if (!item) return "";
      const counts = item.counts && typeof item.counts === "object" ? Object.entries(item.counts).slice(0, 8) : [];
      const rows = Array.isArray(item.handled) ? item.handled.slice(0, 5) : Array.isArray(item.all_current) ? item.all_current.slice(0, 5) : Array.isArray(item.all_motorcycles) ? item.all_motorcycles.slice(0, 5) : Array.isArray(item.items) ? item.items.slice(0, 5) : [];
      return `<div class="card" style="margin-bottom:1rem"><div class="card-header"><div><div class="card-header-title">${esc(title)}</div><div class="card-header-subtitle">${esc(item.description || "Authoritative records for this tenure")}</div></div></div><div class="card-body">${counts.length ? `<div class="dashboard-grid dashboard-grid-4" style="margin-bottom:1rem">${counts.map(([k,v]) => metric(k.replaceAll("_", " "), label(v))).join("")}</div>` : ""}${rows.length ? `<div class="table-container"><table class="data-table"><tbody>${rows.map((row) => `<tr><td>${esc(label(row))}</td><td class="cell-muted">${esc(row.status || row.condition || row.case_number || "")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="cell-muted">No records in this section.</p>`}</div></div>`;
    }
    function render(data) {
      const h = data.handover || {}, admin = data.report && data.report.administration;
      const name = h.executive ? `${h.executive.full_name} — ${h.executive.post}` : "Handover ledger";
      const report = data.report || {};
      return `<div class="page-header" style="flex-wrap:wrap;gap:1rem"><div class="page-header-left"><h1>${esc(name)}</h1><p>Handover details and tenure-scoped accountability report</p><p class="cell-muted">${esc(h.tenure_start || "—")} → ${esc(h.tenure_end || "Present")} · ${esc(h.election ? h.election.title : "Founding administration")}</p></div><div class="page-header-actions" style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn btn-secondary" href="handover-list.html">Back</a>${data.can_manage ? `<a class="btn btn-primary" href="handover-form.html?id=${h.id}">Edit</a>` : ""}${data.can_delete ? `<button class="btn btn-danger" id="deleteButton" type="button">Delete</button>` : ""}</div></div>
      <div class="dashboard-grid dashboard-grid-4" style="margin-bottom:1.5rem">${metric("Physical cash at hand", money(h.cash_remaining), "accent-success")}${metric("Total revenue", money(h.total_revenue), "accent-info")}${metric("Total expenses", money(h.total_expenses), "accent-warning")}${metric("Net balance", money(h.net_balance), "")}</div>
      <div class="card" style="margin-bottom:1.5rem"><div class="card-header"><div class="card-header-title">Ledger notes</div></div><div class="card-body"><div class="kv-row"><span>Assets and records handed over</span><strong>${esc(h.assets_description || "—")}</strong></div><div class="kv-row"><span>Notes</span><strong>${esc(h.notes || "—")}</strong></div></div></div>
      ${admin ? `<div class="card" style="margin-bottom:1.5rem"><div class="card-body"><p class="cell-muted">${esc(admin.name)} · ${esc(admin.status)} · ${esc(admin.member_count)} executive records</p></div></div>` : ""}
      ${section("Finance", report.finance)}${section("Projects", report.projects)}${section("Cases", report.cases)}${section("Task force", report.taskforce)}${section("Motorcycles", report.motorcycles)}${section("Project donations", report.donations)}${section("Pledges", report.pledges)}${section("Membership", report.membership)}${section("Audit and other records", report.extra_sections)}`;
    }
    (async function(){
      const user = await window.OYA_SHELL.init({ page: "handover", title: "Handover Details" }); if (!user || !id) return;
      try { const data = await window.OYA_API.apiFetch(`/elections/api/handovers/${encodeURIComponent(id)}/`); document.getElementById("content").innerHTML = render(data); document.getElementById("content").hidden = false; document.getElementById("loadingState").style.display = "none"; const modal=document.getElementById("confirmModal"); const close=()=>window.OYA.closeModal("confirmModal"); document.getElementById("cancelDelete").onclick=close; document.getElementById("cancelDelete2").onclick=close; const del=document.getElementById("deleteButton"); if(del) del.onclick=()=>window.OYA.openModal("confirmModal"); document.getElementById("confirmDelete").onclick=async()=>{ const b=document.getElementById("confirmDelete"); b.disabled=true; b.textContent="Deleting…"; try{await window.OYA_API.apiFetch(`/elections/api/handovers/${encodeURIComponent(id)}/delete/`,{method:"DELETE",retries:0}); window.OYA.showToast("Handover deleted.","success"); setTimeout(()=>location.assign("handover-list.html"),350);}catch(error){window.OYA.showToast(error.message,"error");b.disabled=false;b.textContent="Delete handover";}}; } catch(error){ document.getElementById("loadingState").innerHTML=`<div class="alert alert-danger">Couldn't load handover: ${esc(error.message)}</div>`; }
    })();
  </script>
</body></html>
