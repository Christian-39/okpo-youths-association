<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d62">
  <title>Record Expense | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:640px;">

          <div class="page-header">
            <div class="page-header-left">
              <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem);">Record Expense</h1>
              <p style="font-size:clamp(0.75rem, 2vw, 0.875rem);">Treasury balance: <strong id="treasuryBalance">—</strong></p>
            </div>
          </div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="expenseForm" class="card" novalidate>
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">

              <div class="form-group">
                <label class="form-label" for="amount">Amount (&#x20A6;)</label>
                <input type="number" id="amount" name="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="category">Category</label>
                <select id="category" name="category" class="form-select" required></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4" placeholder="Describe the expense..." required></textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="receipt_file">Receipt <span style="color:var(--oya-danger);">*</span></label>
                <input type="file" id="receipt_file" name="receipt_file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required>
                <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Receipt upload is mandatory. Max 10MB.</span>
              </div>

            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="expenses.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function naira(n) { return "\u20A6" + Math.round(Number(n) || 0).toLocaleString("en-NG"); }

    function showErrors(errors) {
      const box = document.getElementById("formErrorsBox");
      const lines = [];
      if (Array.isArray(errors)) lines.push(...errors);
      else if (errors && typeof errors === "object") {
        Object.entries(errors).forEach(([field, msgs]) => (Array.isArray(msgs) ? msgs : [msgs]).forEach((m) => lines.push(`${field}: ${m.message || m}`)));
      }
      box.innerHTML = lines.map((m) => `<div class="alert alert-danger" style="margin-bottom:0.5rem;">${esc(m)}</div>`).join("");
      box.style.display = lines.length ? "" : "none";
    }

    document.getElementById("expenseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      showErrors([]);

      const formData = new FormData(document.getElementById("expenseForm"));
      try {
        await window.OYA_API.apiFetch("/finance/api/expenses/create/", { method: "POST", body: formData });
        window.location.href = "expenses.html";
      } catch (err) {
        if (err.status === 400 && err.data) showErrors(err.data.errors || err.data);
        else showErrors([err.message || "Something went wrong."]);
        btn.disabled = false;
      }
    });

    (async function () {
      const user = await window.OYA_SHELL.init({ page: "expenses", title: "Record Expense", requireExecutive: true });
      if (!user) return;

      const choices = [
        ["ADMINISTRATIVE", "Administrative"], ["PROJECT", "Project"], ["EVENT", "Event"],
        ["MAINTENANCE", "Maintenance"], ["SALARY", "Salary"], ["OTHER", "Other"],
      ];
      const sel = document.getElementById("category");
      choices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; sel.appendChild(o); });

      try {
        const data = await window.OYA_API.apiFetch("/finance/api/expenses/?page=1");
        document.getElementById("treasuryBalance").textContent = naira(data.treasury_balance);
      } catch (_) { /* non-fatal */ }
    })();
  </script>
</body>
</html>
