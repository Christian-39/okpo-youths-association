<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>My Profile | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
  <style>
    /* Page-scoped styles — ported from accounts/profile.html's original
       inline <style> block (Django-template source of truth). */
    .badge-prepaid-mini {
      background: var(--oya-info-bg);
      color: var(--oya-info);
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 600;
      margin-left: 0.25rem;
    }
    @media (max-width: 768px) {
      .detail-meta-grid { grid-template-columns: 1fr 1fr !important; }
      .dashboard-grid-2 { grid-template-columns: 1fr !important; }
      .dashboard-grid-4 { grid-template-columns: 1fr 1fr !important; }
      .page-header { flex-direction: column !important; align-items: flex-start !important; }
      .page-header-actions { width: 100% !important; flex-wrap: wrap !important; }
      .form-actions .btn { width: 100% !important; justify-content: center !important; }
      .form-row { grid-template-columns: 1fr !important; gap: 0 !important; }
    }
    @media (max-width: 480px) {
      .detail-meta-grid { grid-template-columns: 1fr !important; }
      .dashboard-grid-4 { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">
          <div id="loadingState" style="text-align:center;padding:3rem;color:var(--oya-text-muted);">Loading&hellip;</div>
          <div id="detailContent" style="display:none;"></div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/profile.js"></script>
</body>
</html>
