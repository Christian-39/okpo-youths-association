<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Election Form | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:640px;">

          <div class="page-header"><div class="page-header-left"><h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Create Election</h1></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="electionForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="title">Election Title</label>
                <input type="text" id="title" name="title" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="start_date">Start Date &amp; Time</label>
                <input type="datetime-local" id="start_date" name="start_date" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="end_date">End Date &amp; Time</label>
                <input type="datetime-local" id="end_date" name="end_date" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select"></select>
                <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Setting status to Completed automatically applies election results (winners become executives).</span>
              </div>
              <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4"></textarea>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="elections.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/election-form.js"></script>
</body>
</html>
