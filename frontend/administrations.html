<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a3d62"><link rel="manifest" href="manifest.webmanifest"><script>(function(){try{var t=localStorage.getItem("oya_theme");var d=(t==="dark"||t==="light")?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script><title>Previous Administrations | OYA</title><link rel="icon" type="image/png" href="assets/images/oya_logo.png"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/darkmode.css"><link rel="stylesheet" href="assets/css/mobile.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/pwa.css"></head>
<body><div class="app-shell"><div id="sidebar-slot"></div><div class="sidebar-overlay" id="sidebarOverlay"></div><main class="main-content" id="mainContent"><div id="topbar-slot"></div><div class="content-area"><div class="page-container"><div class="page-header"><div class="page-header-left"><h1>Previous administrations</h1><p>Historical executive cohorts and their accountability reports.</p></div><div class="page-header-actions"><a class="btn btn-secondary" href="handover-list.html">Handover ledger</a></div></div><div class="card"><div class="table-container"><table class="data-table"><thead><tr><th>Administration</th><th>Status</th><th>Tenure</th><th>Executive records</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--oya-text-muted)">Loading…</td></tr></tbody></table></div></div></div></div><div id="footer-slot"></div></main></div><div id="mobile-top-header-slot"></div><div id="mobile-nav-slot"></div>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/pwa.js"></script><script>
const esc=(v)=>{const n=document.createElement("span");n.textContent=v==null?"":String(v);return n.innerHTML;};
(async function(){const user=await window.OYA_SHELL.init({page:"handover",title:"Previous Administrations",requireExecutive:true});if(!user)return;try{const data=await window.OYA_API.apiFetch("/elections/api/administrations/");const rows=data.administrations||[];document.getElementById("tbody").innerHTML=rows.length?rows.map((a)=>`<tr><td><span class="cell-name">${esc(a.name)}</span><div class="cell-muted">${esc(a.election&&a.election.title||"Founding administration")}</div></td><td><span class="badge ${a.is_current?"badge-success":"badge-secondary"}">${esc(a.status)}</span></td><td class="cell-muted">${esc(a.tenure_start||"—")} → ${esc(a.tenure_end||"Present")}</td><td>${esc(a.member_count)}</td><td><a class="btn btn-sm btn-ghost" href="administration-report.html?key=${encodeURIComponent(a.key)}">View report</a></td></tr>`).join(""):"<tr><td colspan=\"5\" style=\"text-align:center;padding:2rem;color:var(--oya-text-muted)\">No administration records available.</td></tr>";}catch(error){document.getElementById("tbody").innerHTML=`<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--oya-danger)">${esc(error.message)}</td></tr>`;}})();
</script></body></html>
