<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Resolve Case | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:600px;">

          <div class="page-header"><div class="page-header-left"><h1 style="font-size:clamp(1.125rem,3vw,1.5rem);">Resolve Case</h1><p id="caseSubtitle" style="font-size:0.875rem;color:var(--oya-text-muted);"></p></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>
          <div id="fineNotice" style="display:none;margin-bottom:1rem;" class="alert alert-success"></div>

          <form id="resolveForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="resolved_by">Resolved By (Task Force)</label>
                <select id="resolved_by" name="resolved_by" class="form-select"><option value="">--------- Select Task Force Member ---------</option></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="resolved_date">Resolved Date</label>
                <input type="date" id="resolved_date" name="resolved_date" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="resolution_notes">Resolution Notes</label>
                <textarea id="resolution_notes" name="resolution_notes" class="form-control" rows="5" placeholder="Describe the resolution/outcome..."></textarea>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="cases.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Resolve Case</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/case-resolve.js"></script>
</body>
</html>
