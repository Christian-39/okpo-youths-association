<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3d62">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="assets/js/early-theme.js"></script>
  <title>Project Form | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:700px;">

          <div class="page-header">
            <div class="page-header-left"><h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Create Project</h1></div>
          </div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="projectForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="title">Project Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Project title" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="budget">Budget (&#x20A6;)</label>
                <input type="number" id="budget" name="budget" class="form-control" step="0.01" min="0" placeholder="0.00" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="6" placeholder="Project description..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="progress_percentage">Progress Percentage</label>
                <input type="number" id="progress_percentage" name="progress_percentage" class="form-control" min="0" max="100" placeholder="0-100" value="0">
              </div>

              <hr style="border-color:var(--oya-border);">

              <div class="form-group">
                <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;">
                  <input type="checkbox" id="enable_fundraising" name="enable_fundraising" class="form-check-input">
                  Enable Fundraising
                </label>
                <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Allow donations to be raised for this project.</span>
              </div>

              <div id="fundraisingFields" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="target_amount">Target Amount (&#x20A6;)</label>
                  <input type="number" id="target_amount" name="target_amount" class="form-control" step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="form-group">
                  <label class="form-label" for="fundraising_start_date">Fundraising Start Date</label>
                  <input type="date" id="fundraising_start_date" name="fundraising_start_date" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label" for="fundraising_end_date">Fundraising End Date</label>
                  <input type="date" id="fundraising_end_date" name="fundraising_end_date" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label" for="fundraising_status">Fundraising Status</label>
                  <select id="fundraising_status" name="fundraising_status" class="form-select"></select>
                </div>
                <div class="form-group">
                  <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;">
                    <input type="checkbox" id="include_in_group_reports" name="include_in_group_reports" class="form-check-input" checked>
                    Include in Donation Group Reports
                  </label>
                  <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">If disabled, this project's donations are excluded from donation group reports only.</span>
                </div>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="projects.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/pages/project-form.js"></script>
</body>
</html>
