<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d62">
  <title>Record Donation | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>
      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer" style="max-width:680px;">

          <div class="page-header"><div class="page-header-left"><h1 id="formTitle" style="font-size:clamp(1.125rem,3vw,1.5rem);">Record Donation</h1></div></div>

          <div id="formErrorsBox" style="display:none;margin-bottom:1rem;"></div>

          <form id="donationForm" class="card">
            <div class="card-body" style="display:flex;flex-direction:column;gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="project">Fundraising Project</label>
                <select id="project" name="project" class="form-select" required><option value="">-- Select Fundraising Project --</option></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="donor_type">Donor Type</label>
                <select id="donor_type" name="donor_type" class="form-select" required></select>
              </div>

              <div class="form-group" id="memberGroup">
                <label class="form-label" for="member">Member</label>
                <select id="member" name="member" class="form-select"><option value="">Search member by name, no. or phone…</option></select>
              </div>

              <div class="form-group" id="outsideDonorGroup" style="display:none;">
                <label class="form-label" for="outside_donor">Outside Donor</label>
                <select id="outside_donor" name="outside_donor" class="form-select"><option value="">-- Select Outside Donor --</option></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="invited_by">Invited By (optional)</label>
                <select id="invited_by" name="invited_by" class="form-select"><option value="">Search inviting member (optional)…</option></select>
              </div>

              <div class="form-group">
                <label class="form-label" for="donation_type">Donation Type</label>
                <select id="donation_type" name="donation_type" class="form-select" required></select>
              </div>

              <!-- Money fields -->
              <div id="moneyFields" style="display:flex;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="amount">Amount (&#x20A6;)</label>
                  <input type="number" id="amount" name="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00">
                </div>
              </div>

              <!-- Material fields -->
              <div id="materialFields" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="material_name">Material Name</label>
                  <input type="text" id="material_name" name="material_name" class="form-control" placeholder="e.g. Bags of Rice, Cement, Chairs">
                </div>
                <div class="form-group">
                  <label class="form-label" for="quantity">Quantity</label>
                  <input type="text" id="quantity" name="quantity" class="form-control" placeholder="e.g. 50 bags, 200kg, 20 units">
                </div>
              </div>

              <!-- Labour fields -->
              <div id="labourFields" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="labour_type">Labour Type</label>
                  <input type="text" id="labour_type" name="labour_type" class="form-control" placeholder="e.g. Carpentry, Painting, Site Supervision">
                </div>
                <div class="form-group">
                  <label class="form-label" for="number_of_days">Number of Days</label>
                  <input type="number" id="number_of_days" name="number_of_days" class="form-control" min="1" placeholder="Number of days">
                </div>
              </div>

              <!-- Material/Labour shared -->
              <div id="estimatedValueGroup" style="display:none;flex-direction:column;gap:1.25rem;">
                <div class="form-group">
                  <label class="form-label" for="estimated_value">Estimated Value (&#x20A6;)</label>
                  <input type="number" id="estimated_value" name="estimated_value" class="form-control" step="0.01" min="0" placeholder="Optional">
                </div>
                <div class="form-group" id="updateTreasuryGroup">
                  <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;">
                    <input type="checkbox" id="update_treasury" name="update_treasury" class="form-check-input">
                    Update Treasury?
                  </label>
                  <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Material donations only: if enabled, the estimated value is recorded as income.</span>
                </div>
              </div>

              <div class="form-group" id="paymentMethodGroup">
                <label class="form-label" for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="reference_number">Reference Number</label>
                <input type="text" id="reference_number" name="reference_number" class="form-control" placeholder="Reference / Receipt Number">
              </div>
              <div class="form-group">
                <label class="form-label" for="receipt">Receipt</label>
                <input type="file" id="receipt" name="receipt" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="narration">Narration</label>
                <textarea id="narration" name="narration" class="form-control" rows="2" placeholder="Narration or notes..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label" for="remarks">Remarks</label>
                <textarea id="remarks" name="remarks" class="form-control" rows="2" placeholder="Remarks..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label" for="donation_date">Donation Date</label>
                <input type="date" id="donation_date" name="donation_date" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select"></select>
                <span class="form-help" style="font-size:0.8125rem;color:var(--oya-text-muted);">Pledge: donor has committed but not yet fulfilled. Confirmed: contribution received.</span>
              </div>
            </div>
            <div class="card-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;">
              <a href="donations.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            </div>
          </form>

        </div>
      </div>
      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function showErrors(errors) {
      const box = document.getElementById("formErrorsBox");
      const lines = [];
      if (Array.isArray(errors)) lines.push(...errors);
      else if (errors && typeof errors === "object") Object.entries(errors).forEach(([f, m]) => (Array.isArray(m) ? m : [m]).forEach((x) => lines.push(`${f}: ${x.message || x}`)));
      box.innerHTML = lines.map((m) => `<div class="alert alert-danger" style="margin-bottom:0.5rem;">${esc(m)}</div>`).join("");
      box.style.display = lines.length ? "" : "none";
    }
    const id = new URLSearchParams(window.location.search).get("id");
    const isEdit = !!id;

    function toggleDonorTypeFields() {
      const isOutside = document.getElementById("donor_type").value === "OUTSIDE";
      document.getElementById("memberGroup").style.display = isOutside ? "none" : "";
      document.getElementById("outsideDonorGroup").style.display = isOutside ? "" : "none";
    }
    function toggleDonationTypeFields() {
      const type = document.getElementById("donation_type").value;
      document.getElementById("moneyFields").style.display = type === "MONEY" ? "flex" : "none";
      document.getElementById("materialFields").style.display = type === "MATERIAL" ? "flex" : "none";
      document.getElementById("labourFields").style.display = type === "LABOUR" ? "flex" : "none";
      document.getElementById("estimatedValueGroup").style.display = (type === "MATERIAL" || type === "LABOUR") ? "flex" : "none";
      document.getElementById("updateTreasuryGroup").style.display = type === "MATERIAL" ? "" : "none";
      document.getElementById("paymentMethodGroup").style.display = type === "MONEY" ? "" : "none";
    }
    document.getElementById("donor_type").addEventListener("change", toggleDonorTypeFields);
    document.getElementById("donation_type").addEventListener("change", toggleDonationTypeFields);

    document.getElementById("donationForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      showErrors([]);
      const formData = new FormData(document.getElementById("donationForm"));
      if (!document.getElementById("update_treasury").checked) formData.set("update_treasury", "");
      try {
        const endpoint = isEdit ? `/project-donations/api/donations/${id}/update/` : "/project-donations/api/donations/create/";
        const data = await window.OYA_API.apiFetch(endpoint, { method: "POST", body: formData });
        window.location.href = "donations.html";
      } catch (err) {
        if (err.status === 400 && err.data) showErrors(err.data.errors || err.data);
        else showErrors([err.message || "Something went wrong."]);
        btn.disabled = false;
      }
    });

    (async function () {
      const user = await window.OYA_SHELL.init({ page: "donations", title: isEdit ? "Edit Donation" : "Record Donation", requireExecutive: true });
      if (!user) return;

      try {
        const meta = await window.OYA_API.apiFetch("/project-donations/api/donations/form-meta/");
        const projSel = document.getElementById("project");
        meta.projects.forEach((p) => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.title; projSel.appendChild(o); });
        const donorTypeSel = document.getElementById("donor_type");
        meta.donor_type_choices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; donorTypeSel.appendChild(o); });
        const memberSel = document.getElementById("member");
        meta.members.forEach((m) => { const o = document.createElement("option"); o.value = m.id; o.textContent = `${m.full_name} (${m.serial_number})`; memberSel.appendChild(o); });
        const outsideSel = document.getElementById("outside_donor");
        meta.outside_donors.forEach((d) => { const o = document.createElement("option"); o.value = d.id; o.textContent = d.full_name; outsideSel.appendChild(o); });
        const invitedSel = document.getElementById("invited_by");
        meta.members.forEach((m) => { const o = document.createElement("option"); o.value = m.id; o.textContent = `${m.full_name} (${m.serial_number})`; invitedSel.appendChild(o); });
        const typeSel = document.getElementById("donation_type");
        meta.donation_type_choices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; typeSel.appendChild(o); });
        const paySel = document.getElementById("payment_method");
        meta.payment_method_choices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; paySel.appendChild(o); });
        const statusSel = document.getElementById("status");
        meta.status_choices.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; statusSel.appendChild(o); });

        toggleDonorTypeFields();
        toggleDonationTypeFields();

        if (isEdit) {
          document.getElementById("formTitle").textContent = "Edit Donation";
          const { donation } = await window.OYA_API.apiFetch(`/project-donations/api/donations/${id}/`);
          // Note: donation-detail only returns display-safe fields; for a
          // fuller pre-fill (exact member/outside_donor id, raw material
          // fields) this form relies on re-entering those specifics on edit.
          if (donation.project) projSel.value = donation.project.id;
          donorTypeSel.value = donation.donor_type;
          typeSel.value = donation.donation_type;
          document.getElementById("amount").value = donation.amount || "";
          paySel.value = donation.payment_method;
          document.getElementById("reference_number").value = donation.reference_number || "";
          statusSel.value = donation.status;
          document.getElementById("donation_date").value = donation.donation_date;
          toggleDonorTypeFields();
          toggleDonationTypeFields();
        } else {
          document.getElementById("donation_date").value = new Date().toISOString().slice(0, 10);
        }
      } catch (err) {
        showErrors([err.message || "Couldn't load the form."]);
      }
    })();
  </script>
</body>
</html>
