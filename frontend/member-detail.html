<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d62">
  <title>Member Details | OYA</title>
  <link rel="icon" type="image/png" href="assets/images/oya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/darkmode.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content" id="mainContent">
      <div id="topbar-slot"></div>

      <div class="content-area" id="contentArea">
        <div class="page-container" id="pageContainer">
          <div id="loadingState" style="text-align:center;padding:3rem;color:var(--oya-text-muted);">Loading member&hellip;</div>
          <div id="detailContent" style="display:none;"></div>
        </div>
      </div>

      <div id="footer-slot"></div>
    </main>
  </div>
  <div id="mobile-top-header-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "2-digit" });
    }
    function metaItem(label, value) {
      return `<div class="meta-item">
        <span class="meta-label" style="font-size:clamp(0.6875rem, 1.5vw, 0.75rem)">${label}</span>
        <span class="meta-value" style="font-size:clamp(0.8125rem, 2vw, 0.9375rem)">${value}</span>
      </div>`;
    }
    function statusBadge(status) {
      if (status === "ACTIVE") return `<span class="badge badge-success" style="white-space:nowrap;">Active Member</span>`;
      if (status === "PAST_MEMBER") return `<span class="badge badge-warning" style="font-size:clamp(0.625rem, 1.5vw, 0.75rem);white-space:nowrap;">Past Member</span>`;
      if (status === "REMOVED") return `<span class="badge badge-danger" style="font-size:clamp(0.625rem, 1.5vw, 0.75rem);white-space:nowrap;">Removed</span>`;
      return `<span class="badge">${esc(status)}</span>`;
    }

    function render(member, isExecutive) {
      const avatar = member.photo_url
        ? `<img src="${member.photo_url}" alt="${esc(member.full_name)}" class="detail-avatar" style="object-fit:cover;">`
        : `<div class="detail-avatar" style="background:var(--oya-primary);color:#fff;font-size:clamp(1.125rem, 4vw, 1.5rem);">${esc((member.full_name || "").slice(0, 2).toUpperCase())}</div>`;

      return `
      <div class="detail-header" style="flex-wrap:wrap;gap:1rem;">
        <div class="detail-title-section" style="flex-wrap:wrap;gap:1rem;">
          ${avatar}
          <div>
            <h1 style="font-size:clamp(1.125rem, 3vw, 1.5rem)">${esc(member.full_name)}</h1>
            <div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.25rem;flex-wrap:wrap;">
              ${statusBadge(member.status)}
              <span style="font-size:clamp(0.75rem, 2vw, 0.875rem);color:var(--oya-text-muted);white-space:nowrap;">
                ${esc(member.serial_number)} &middot; ${esc(member.clan ? member.clan.name : "No Clan")}
              </span>
            </div>
          </div>
        </div>
        ${isExecutive ? `
        <div class="page-header-actions" style="flex-wrap:wrap;gap:0.5rem;">
          <a href="member-form.html?id=${member.id}" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
          </a>
        </div>` : ""}
      </div>

      <div class="dashboard-grid dashboard-grid-2" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));margin-bottom:clamp(0.75rem, 3vw, 1.5rem);">
        <div class="card">
          <div class="card-header"><div class="card-header-title" style="font-size:clamp(0.9375rem, 2.5vw, 1rem)">Basic Information</div></div>
          <div class="card-body">
            <div class="detail-meta-grid" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr));">
              ${metaItem("Full Name", esc(member.full_name))}
              ${metaItem("Age", `${member.age != null ? member.age : "—"} years`)}
              ${metaItem("Age Valid", member.age_check ? `<span style="color:var(--oya-success)">&check; Valid (18-55)</span>` : `<span style="color:var(--oya-danger)">&cross; Invalid</span>`)}
              ${metaItem("Should be Past Member", member.should_be_past_member ? `<span style="color:var(--oya-warning)">Yes (age &ge; 56)</span>` : `<span style="color:var(--oya-text-muted)">No</span>`)}
              ${metaItem("Clan", esc(member.clan ? member.clan.name : "—"))}
              ${metaItem("Serial Number", esc(member.serial_number))}
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-header-title" style="font-size:clamp(0.9375rem, 2.5vw, 1rem)">Contact Information</div></div>
          <div class="card-body">
            <div class="detail-meta-grid" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr));">
              ${metaItem("Phone Number", esc(member.phone || "—"))}
              ${metaItem("State or Abroad", esc(member.state_or_abroad || "—"))}
              ${metaItem("Member Since", fmtDate(member.created_at))}
              ${metaItem("Last Updated", fmtDate(member.updated_at))}
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid dashboard-grid-2" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));margin-bottom:clamp(0.75rem, 3vw, 1.5rem);">
        <div class="card">
          <div class="card-header"><div class="card-header-title" style="font-size:clamp(0.9375rem, 2.5vw, 1rem)">Membership Status</div></div>
          <div class="card-body">
            <div style="display:flex;flex-direction:column;gap:1rem;">
              <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem;background:var(--oya-bg);border-radius:var(--radius-md);">
                <div>
                  <div style="font-size:clamp(0.6875rem, 1.5vw, 0.8125rem);color:var(--oya-text-muted);">Current Status</div>
                  <div style="margin-top:0.25rem;">${statusBadge(member.status)}</div>
                </div>
                <span class="status-dot ${member.is_active_member ? "active" : member.is_past_member ? "warning" : "danger"}"></span>
              </div>
              ${member.removal_reason ? `
              <div style="padding:1rem;background:var(--oya-danger-50);border-radius:var(--radius-md);border:1px solid var(--oya-danger-100);">
                <div style="font-size:clamp(0.6875rem, 1.5vw, 0.8125rem);color:var(--oya-danger);font-weight:600;margin-bottom:0.5rem;">Removal Reason</div>
                <div style="font-size:clamp(0.75rem, 2vw, 0.875rem);color:var(--oya-text-primary);">${esc(member.removal_reason)}</div>
              </div>` : ""}
              ${member.offense_committed ? `
              <div style="padding:1rem;background:var(--oya-warning-50);border-radius:var(--radius-md);border:1px solid var(--oya-warning-100);">
                <div style="font-size:clamp(0.6875rem, 1.5vw, 0.8125rem);color:var(--oya-warning);font-weight:600;margin-bottom:0.5rem;">Offense Committed</div>
                <div style="font-size:clamp(0.75rem, 2vw, 0.875rem);color:var(--oya-text-primary);">${esc(member.offense_committed)}</div>
              </div>` : ""}
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-header-title" style="font-size:clamp(0.9375rem, 2.5vw, 1rem)">Member Photo</div></div>
          <div class="card-body" style="text-align:center;padding:clamp(1rem, 4vw, 2rem);">
            ${member.photo_url
              ? `<img src="${member.photo_url}" alt="${esc(member.full_name)}" style="max-width:min(200px, 80vw);max-height:min(200px, 80vw);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);">`
              : `<div style="color:var(--oya-text-muted);padding:2rem;">No photo uploaded</div>`}
          </div>
        </div>
      </div>`;
    }

    (async function () {
      const user = await window.OYA_SHELL.init({ page: "members", title: "Member Profile" });
      if (!user) return;

      const id = new URLSearchParams(window.location.search).get("id");
      const contentEl = document.getElementById("detailContent");
      const loadingEl = document.getElementById("loadingState");

      if (!id) {
        loadingEl.innerHTML = `<div class="alert alert-danger" style="max-width:480px;margin:0 auto;">No member specified.</div>`;
        return;
      }

      try {
        const data = await window.OYA_API.apiFetch(`/members/api/${id}/`);
        contentEl.innerHTML = render(data.member, !!user.has_executive_access);
        loadingEl.style.display = "none";
        contentEl.style.display = "";
      } catch (err) {
        loadingEl.innerHTML = `<div class="alert alert-danger" style="max-width:480px;margin:0 auto;">Couldn't load this member: ${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
